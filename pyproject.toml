[project]
name = "seqgen"
version = "0.1.0"
description = "Abstract pulse sequence generation framework with device adapters"
readme = "README.md"
authors = [{ name = "David Broadway" }]
license = { file = "../../LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
  "loguru",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
